<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mint Vietsub — Kho tập mới nhất</title>
<meta name="description" content="Tổng hợp các tập phim hoạt hình Trung Quốc vietsub mới nhất từ kênh Mint Vietsub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14100f;
    --bg-raised: #1f1915;
    --line: #3a2f28;
    --ink: #ede6dc;
    --ink-dim: #a89c8d;
    --red: #c7442e;
    --gold: #c9a363;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.serif{ font-family:'Noto Serif', serif; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(199,68,46,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,163,99,0.08), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative;
    z-index:1;
    padding:28px 6vw 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand-mark{ width:10px; height:10px; background:var(--red); display:inline-block; transform:rotate(45deg); }
  .brand h1{ font-size:1.5rem; margin:0; letter-spacing:0.02em; font-weight:700; }
  .brand span{ color:var(--gold); }

  .header-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  .search-box{ position:relative; }
  .search-box input{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 14px 9px 34px;
    font-family:inherit;
    font-size:0.9rem;
    width:220px;
    outline:none;
    transition:border-color 0.15s ease;
  }
  .search-box input:focus{ border-color:var(--gold); }
  .search-box svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:15px; height:15px;
    stroke:var(--ink-dim);
  }

  header a.subscribe{
    color:var(--bg);
    background:var(--red);
    text-decoration:none;
    padding:10px 18px;
    font-size:0.9rem;
    font-weight:600;
    white-space:nowrap;
    transition:background 0.15s ease;
  }
  header a.subscribe:hover{ background:#a8371f; }

  nav.tabs{
    position:relative; z-index:1;
    max-width:1180px;
    margin:24px auto 0;
    padding:0 6vw;
    display:flex;
    gap:6px;
  }
  nav.tabs button{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:9px 18px;
    font-family:inherit;
    font-size:0.88rem;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  nav.tabs button.active{
    color:var(--bg);
    background:var(--gold);
    border-color:var(--gold);
  }

  main{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:0 6vw 80px;
  }

  #hero-section{ padding-top:44px; }
  .hero-label{ color:var(--gold); font-size:0.85rem; margin-bottom:10px; }
  .hero-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:36px; align-items:start; }
  .hero-player{
    position:relative; aspect-ratio:16/9; background:#0a0807;
    border:1px solid var(--line); overflow:hidden; cursor:pointer;
  }
  .hero-player iframe{ width:100%; height:100%; border:0; display:block; }
  .hero-player img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero-info h2{ font-size:1.6rem; margin:0 0 14px; line-height:1.3; }
  .hero-info p.meta{ color:var(--ink-dim); font-size:0.9rem; margin:0 0 18px; }
  .hero-info .desc{ color:var(--ink-dim); font-size:0.92rem; max-width:60ch; }

  #list-section{ margin-top:64px; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:28px;
  }
  .section-head h2{ font-size:1.3rem; margin:0; }
  .section-head .count{ color:var(--ink-dim); font-size:0.85rem; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:26px 22px;
  }
  .card{
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-raised);
    display:flex;
    flex-direction:column;
    transition:border-color 0.15s ease;
  }
  .card:hover{ border-color:var(--gold); }
  .thumb-wrap{ position:relative; aspect-ratio:16/9; overflow:hidden; background:#0a0807; }
  .thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-wrap .play-badge{
    position:absolute; right:8px; bottom:8px;
    background:rgba(10,8,7,0.85);
    color:var(--gold);
    font-size:0.7rem;
    padding:3px 7px;
    border:1px solid var(--gold);
  }
  .card-body{ padding:14px 14px 16px; }
  .card-body h3{
    font-size:0.98rem; font-weight:500; margin:0 0 8px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-body .date{ color:var(--ink-dim); font-size:0.78rem; }

  /* Grid phim (poster dọc) */
  .show-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:24px 20px;
  }
  .show-card{
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-raised);
    transition:border-color 0.15s ease, transform 0.15s ease;
  }
  .show-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .show-poster{
    position:relative; aspect-ratio:2/3; overflow:hidden; background:#0a0807;
  }
  .show-poster img{ width:100%; height:100%; object-fit:cover; display:block; }
  .show-poster .ep-tag{
    position:absolute; left:0; bottom:0; right:0;
    background:linear-gradient(to top, rgba(10,8,7,0.9), transparent);
    color:var(--gold); font-size:0.75rem; padding:16px 10px 8px;
  }
  .show-card-body{ padding:10px 12px 14px; }
  .show-card-body h3{
    font-size:0.9rem; font-weight:500; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  #status{ color:var(--ink-dim); padding:60px 0; text-align:center; font-size:0.95rem; }
  #status a{ color:var(--gold); }
  #empty-search{ display:none; color:var(--ink-dim); padding:40px 0; text-align:center; }

  footer{
    position:relative; z-index:1;
    border-top:1px solid var(--line);
    padding:24px 6vw;
    color:var(--ink-dim);
    font-size:0.82rem;
    text-align:center;
  }
  footer a{ color:var(--gold); text-decoration:none; }

  @media (max-width:820px){
    .hero-grid{ grid-template-columns:1fr; }
    .search-box input{ width:150px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark"></span>
    <h1>Mint <span>Vietsub</span></h1>
  </div>
  <div class="header-right">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" placeholder="Tìm tên video hoặc phim…">
    </div>
    <a class="subscribe" href="https://www.youtube.com/@Mintvietsub25?sub_confirmation=1" target="_blank" rel="noopener">Xem kênh gốc</a>
  </div>
</header>

<nav class="tabs" id="tabs" style="display:none;">
  <button class="active" data-tab="latest">Mới nhất</button>
  <button data-tab="shows">Danh sách phát</button>
</nav>

<main>

  <section id="hero-section" style="display:none;">
    <div class="hero-label serif">Đang chiếu</div>
    <div class="hero-grid">
      <div class="hero-player" id="hero-player"></div>
      <div class="hero-info">
        <h2 id="hero-title"></h2>
        <p class="meta" id="hero-date"></p>
        <p class="desc" id="hero-desc"></p>
      </div>
    </div>
  </section>

  <section id="list-section" style="display:none;">
    <div class="section-head">
      <h2 class="serif" id="list-title">Các tập gần đây</h2>
      <span class="count" id="video-count"></span>
    </div>
    <div class="grid" id="video-grid"></div>
    <div id="empty-search">Không tìm thấy video nào khớp.</div>
  </section>

  <section id="shows-section" style="display:none;">
    <div class="section-head">
      <h2 class="serif">Danh sách phát</h2>
      <span class="count" id="show-count"></span>
    </div>
    <div class="show-grid" id="show-grid"></div>
  </section>

  <div id="status">Đang tải danh sách tập phim…</div>

</main>

<footer>
  Trang tổng hợp không chính thức, dữ liệu lấy từ kênh YouTube Mint Vietsub. ·
  <a href="admin.html">Quản trị</a>
</footer>

<script>
const CHANNEL_ID = "UCw4qWOr8THZx4A410VSaXGw";
const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
const PROXY_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

// ĐỔI địa chỉ này thành URL Worker thật của bạn sau khi deploy
const API_BASE = "https://mint-vietsub-api.YOUR-SUBDOMAIN.workers.dev";

const statusEl = document.getElementById('status');
const tabsEl = document.getElementById('tabs');
const heroSection = document.getElementById('hero-section');
const listSection = document.getElementById('list-section');
const showsSection = document.getElementById('shows-section');
const heroPlayer = document.getElementById('hero-player');
const heroTitle = document.getElementById('hero-title');
const heroDate = document.getElementById('hero-date');
const heroDesc = document.getElementById('hero-desc');
const grid = document.getElementById('video-grid');
const countEl = document.getElementById('video-count');
const listTitle = document.getElementById('list-title');
const emptySearch = document.getElementById('empty-search');
const searchInput = document.getElementById('search-input');
const showGrid = document.getElementById('show-grid');
const showCountEl = document.getElementById('show-count');

let ALL_VIDEOS = [];
let SHOWS = [];
let currentTab = 'latest';

function extractVideoId(item){
  if(item.guid && item.guid.includes('video:')) return item.guid.split('video:')[1];
  const m = item.link.match(/v=([^&]+)/);
  return m ? m[1] : null;
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function esc(str){ return (str || '').replace(/"/g, '&quot;'); }

function playInHero(id, title, date, desc){
  heroPlayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" title="${esc(title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  heroTitle.textContent = title;
  heroDate.textContent = date;
  heroDesc.textContent = desc;
  heroSection.scrollIntoView({ behavior:'smooth', block:'start' });
}
window.playInHero = playInHero;

function setHeroFromVideo(v){
  heroPlayer.innerHTML = `<img src="${v.thumb}" alt="${esc(v.title)}">`;
  heroTitle.textContent = v.title;
  heroDate.textContent = formatDate(v.date);
  heroDesc.textContent = v.desc;
  heroPlayer.onclick = () => playInHero(v.id, v.title, formatDate(v.date), v.desc);
}

function cardHtml(v){
  return `
    <div class="card" onclick='playInHero(${JSON.stringify(v.id)}, ${JSON.stringify(v.title)}, ${JSON.stringify(formatDate(v.date))}, ${JSON.stringify(v.desc)})'>
      <div class="thumb-wrap">
        <img src="${v.thumb}" alt="${esc(v.title)}" loading="lazy">
        <span class="play-badge">▶ Xem</span>
      </div>
      <div class="card-body">
        <h3>${v.title}</h3>
        <div class="date">${formatDate(v.date)}</div>
      </div>
    </div>`;
}

function renderLatest(filterText){
  const filtered = filterText
    ? ALL_VIDEOS.filter(v => v.title.toLowerCase().includes(filterText.toLowerCase()))
    : ALL_VIDEOS;

  listTitle.textContent = filterText ? `Kết quả tìm kiếm` : 'Các tập gần đây';
  countEl.textContent = `${filtered.length} tập`;

  if(filtered.length === 0){
    grid.innerHTML = '';
    emptySearch.style.display = 'block';
    return;
  }
  emptySearch.style.display = 'none';
  grid.innerHTML = filtered.map(v => cardHtml(v)).join('');
}

function renderShows(filterText){
  const filtered = filterText
    ? SHOWS.filter(s => s.title.toLowerCase().includes(filterText.toLowerCase()))
    : SHOWS;

  showCountEl.textContent = `${filtered.length} phim`;

  if(filtered.length === 0){
    showGrid.innerHTML = `<div id="status" style="padding:60px 0;grid-column:1/-1;">
      ${SHOWS.length === 0
        ? `Chưa có phim nào. Vào <a href="admin.html" style="color:var(--gold);">trang quản trị</a> để thêm.`
        : `Không tìm thấy phim khớp.`}
    </div>`;
    return;
  }

  showGrid.innerHTML = filtered.map(s => `
    <div class="show-card" onclick="location.href='watch.html?id=${encodeURIComponent(s.id)}'">
      <div class="show-poster">
        <img src="${s.poster || `https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg`}" alt="${esc(s.title)}" loading="lazy">
        <div class="ep-tag">Xem ngay</div>
      </div>
      <div class="show-card-body">
        <h3>${s.title}</h3>
      </div>
    </div>
  `).join('');
}

function renderCurrentTab(){
  const filterText = searchInput.value.trim();
  if(currentTab === 'latest'){
    listSection.style.display = 'block';
    showsSection.style.display = 'none';
    renderLatest(filterText);
  } else {
    listSection.style.display = 'none';
    showsSection.style.display = 'block';
    renderShows(filterText);
  }
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderCurrentTab();
});

searchInput.addEventListener('input', renderCurrentTab);

async function loadShows(){
  try{
    const res = await fetch(`${API_BASE}/api/shows`);
    const data = await res.json();
    if(data.ok) SHOWS = data.shows || [];
  }catch(err){
    console.warn('Không tải được shows (backend có thể chưa cấu hình):', err);
    SHOWS = [];
  }
}

async function loadVideos(){
  try{
    const res = await fetch(PROXY_URL);
    if(!res.ok) throw new Error('Lỗi mạng: ' + res.status);
    const data = await res.json();
    if(data.status !== 'ok' || !data.items || data.items.length === 0){
      throw new Error('Không lấy được dữ liệu kênh');
    }

    ALL_VIDEOS = data.items.map(item => {
      const id = extractVideoId(item);
      return {
        id,
        title: item.title,
        date: item.pubDate,
        desc: stripHtml(item.description).slice(0, 300),
        thumb: item.thumbnail || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`
      };
    }).filter(v => v.id);

    if(ALL_VIDEOS.length === 0) throw new Error('Không có video nào');

    await loadShows();

    statusEl.style.display = 'none';
    tabsEl.style.display = 'flex';
    heroSection.style.display = 'block';

    setHeroFromVideo(ALL_VIDEOS[0]);
    renderCurrentTab();

  }catch(err){
    console.error(err);
    statusEl.innerHTML = `Không tải được danh sách video lúc này. Vui lòng thử lại sau, hoặc xem trực tiếp tại <a href="https://www.youtube.com/@Mintvietsub25" target="_blank" rel="noopener">kênh YouTube gốc</a>.`;
  }
}

loadVideos();
</script>

</body>
</html>
